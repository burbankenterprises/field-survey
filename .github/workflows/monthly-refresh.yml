name: Monthly Data Refresh

on:
  schedule:
    # 1st of every month at 06:00 UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      auto_apply:
        description: 'Auto-apply all changes (skip PR review)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ------------------------------------------------------------------
      # 1. Source re-verification (live data, not the committed cache)
      # ------------------------------------------------------------------
      - name: Re-verify safety against State Dept advisories
        run: |
          python scripts/refresh_safety.py --apply --fresh > safety_output.txt 2>&1
        continue-on-error: true

      - name: Re-verify cost/healthcare against Numbeo
        run: |
          python scripts/refresh_attributes.py --apply --fresh > attributes_output.txt 2>&1
        continue-on-error: true

      # Dollar estimates: Numbeo direct is WAF-blocked from CI IPs; Wayback
      # snapshots are the proven path (used for v6 dataset). Two passes =
      # ~90% coverage; a third adds ~2%. Unfetched countries keep prior data.
      - name: Refresh dollar cost estimates (Wayback)
        run: |
          python scripts/fetch_cost_dollars_wayback.py > dollars_output.txt 2>&1
          python scripts/fetch_cost_dollars_wayback.py >> dollars_output.txt 2>&1
          python scripts/audit_cost_tiers.py --apply >> dollars_output.txt 2>&1
        continue-on-error: true

      # ------------------------------------------------------------------
      # 2. New annual report? (ingests automatically when published)
      # ------------------------------------------------------------------
      - name: Check for new Service Year Report
        id: newreport
        run: |
          set +e
          python scripts/check_new_report.py > report_check.txt 2>&1
          rc=$?
          cat report_check.txt
          if [ $rc -eq 0 ] && grep -q "^PUBLISHED" report_check.txt; then
            echo "published=true" >> $GITHUB_OUTPUT
            PDF=$(grep "^PUBLISHED" report_check.txt | awk '{print $2}')
            echo "pdf=$PDF" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi
          exit 0   # not published yet is normal, not a failure

      - name: Ingest new report
        if: steps.newreport.outputs.published == 'true'
        run: python scripts/ingest_report.py "${{ steps.newreport.outputs.pdf }}"

      # ------------------------------------------------------------------
      # 3. Re-score + publish
      # ------------------------------------------------------------------
      - name: Run refresh pipeline (dry-run)
        id: refresh
        run: |
          python scripts/refresh.py --dry-run > refresh_output.txt 2>&1
          cat refresh_output.txt

          # Check if there are changes
          if grep -q "No changes detected" refresh_output.txt; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Apply changes and create PR
        if: steps.refresh.outputs.has_changes == 'true' && github.event.inputs.auto_apply != 'true'
        run: |
          python scripts/refresh.py --auto-apply

          # Create a branch and PR
          BRANCH="refresh/$(date +'%Y-%m-%d')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/data/seed.ts data/changelog.json data/territories.json data/last_ingest.json
          git commit -m "data: monthly refresh $(date +'%Y-%m-%d')

          Automated monthly data refresh (safety/Numbeo re-verification + report check).
          See data/changelog.json for details."
          git push origin "$BRANCH"

          # Create PR
          {
            echo "Automated monthly refresh detected changes."
            echo
            echo "## Source re-verification"
            echo '```'
            cat safety_output.txt attributes_output.txt dollars_output.txt 2>/dev/null
            echo '```'
            echo
            echo "## Score/value changes"
            echo '```'
            cat refresh_output.txt
            echo '```'
            echo
            echo "Review the changes above. **Merge to publish.**"
            echo
            echo "To auto-apply without review, re-run this workflow with the **auto_apply** input checked."
          } > pr_body.md
          gh pr create \
            --title "📊 Monthly Data Refresh — $(date +'%Y-%m-%d')" \
            --body-file pr_body.md \
            --base main \
            --head "$BRANCH" \
            --label "data-refresh"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-apply (manual trigger)
        if: steps.refresh.outputs.has_changes == 'true' && github.event.inputs.auto_apply == 'true'
        run: |
          python scripts/refresh.py --auto-apply

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/seed.ts data/changelog.json data/territories.json data/last_ingest.json
          git commit -m "data: monthly refresh $(date +'%Y-%m-%d') (auto-applied)"
          git push origin main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # 4. New report ingested but nothing else changed? Still commit the PDF data.
      # ------------------------------------------------------------------
      - name: Commit ingested report data (no-score-change case)
        if: steps.newreport.outputs.published == 'true' && steps.refresh.outputs.has_changes == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/territories.json data/last_ingest.json src/data/seed.ts 2>/dev/null
          git commit -m "data: ingest $(date +%Y) Service Year Report" || echo "nothing to commit"
          git push origin main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
